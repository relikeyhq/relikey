# ReliKey CI for the public repository: the same gates the private repo runs in its pre-push hook.
# Actions are pinned by commit SHA (the tag is in the comment); Python tools are hash-locked; Dependabot proposes updates.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    name: Model, conformance, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -q --require-hashes -r requirements-test.txt
      - run: python tools/check_model.py
      - run: python tools/check_conformance.py
      - run: python -m pytest -q

  agent:
    name: Edge agent gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"        # build.py refuses any other toolchain (GE-9)
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python agent/build.py check    # gofmt, vet (three targets), staticcheck, tests, mutants
      - run: python agent/build.py race
      - run: python agent/build.py vuln

  leak-gate:
    name: Export leak gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: pip install -q --require-hashes -r requirements-test.txt
      - run: python tools/publish_export.py --strict   # fails on an unclassified file, a hard-fail match or a leak

  licensing-lint:
    name: Licensing (REUSE) and lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -q --require-hashes -r requirements-ci.txt
      - run: reuse lint
      - run: ruff check .

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:   # Go native fuzz targets (FUZZING.md); each runs a short session on every push and pull request
        include:
          - {module: agent, pkg: ./internal/apply, target: FuzzCompute}
          - {module: agent, pkg: ./internal/kcedge, target: FuzzCanonical}
          - {module: agent, pkg: ./internal/kcedge, target: FuzzVerifyBundle}
          - {module: agent, pkg: ./internal/kcedge, target: FuzzNewParsers}
          - {module: fleet, pkg: ./internal/enrol, target: FuzzParseCode}
          - {module: fleet, pkg: ./internal/enrol, target: FuzzAccept}
          - {module: fleet, pkg: ./internal/page, target: FuzzCeremonyRoutes}
          - {module: fleet, pkg: ./internal/registry, target: FuzzParseAuthData}
          - {module: fleet, pkg: ./internal/registry, target: FuzzVerifyCOSE}
          - {module: fleet, pkg: ./internal/registry, target: FuzzAssertionMutation}
          - {module: fleet, pkg: ./internal/registry, target: FuzzVerifyRegistration}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - working-directory: ${{ matrix.module }}
        run: go test ${{ matrix.pkg }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 60s

  fuzz-python:
    name: Fuzz the Python tools (Hypothesis)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -q --require-hashes -r requirements-test.txt
      - run: python -m pytest -q tests/test_release_key.py
        env:
          RELIKEY_FUZZ_EXAMPLES: "5000"
