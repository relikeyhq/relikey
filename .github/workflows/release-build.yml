# SPDX-License-Identifier: EUPL-1.2
# The release build, called by release.yml once CI passed on the tagged commit: the binaries built reproducibly by
# agent/build.py and smoke-tested, their SBOMs and sums, a build provenance attestation and an SBOM attestation per
# binary, keyless cosign signatures on the sums and each binary, and the agent and fleet images on ghcr.io (attested
# and signed by digest). A reusable workflow, so every signature and attestation names this file as the builder and
# the calling workflow cannot change the build steps (SLSA Build L3, #28). Verify: README.md, "Verifying a release".
name: release-build
on:
  workflow_call:
    outputs:
      agent:
        description: The agent image's digest
        value: ${{ jobs.images.outputs.agent }}
      fleet:
        description: The fleet image's digest
        value: ${{ jobs.images.outputs.fleet }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0              # build.py release builds twice from a clean checkout of the tag
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.3"        # build.py refuses any other toolchain
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the binaries, their SBOMs and their sums
        run: python agent/build.py release
      - name: Smoke-test the binaries (run those for this runner, check the ELF target of the others)
        run: python agent/build.py smoke
      - name: Take the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir notes
          if [[ "$version" == *-* ]]; then
            # a release candidate (X.Y.Z-rc.N) has no section of its own: the changes not yet released
            { echo "Release candidate for ${version%%-*}, not a release. Changes since the last release:"; echo
              python tools/changelog.py show; } > notes/notes.md
          else
            awk -v v="## [${version}]" 'index($0, v) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes/notes.md
          fi
          if ! grep -q '^- ' notes/notes.md; then
            echo "no changes for ${version}: CHANGELOG.md needs its section (a candidate: fragments in changelog.d/)" >&2
            exit 1
          fi
          {
            echo
            echo "Verify: \`sha256sum -c SHA256SUMS\`, then \`gh attestation verify FILE --repo ${GITHUB_REPOSITORY}\`;"
            echo "Each binary's CycloneDX SBOM is FILE.cdx.json, attested with it:" \
              "\`gh attestation verify FILE --repo ${GITHUB_REPOSITORY} --predicate-type https://cyclonedx.org/bom\`."
          } >> notes/notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        id: attest
        with:
          subject-checksums: agent/dist/SHA256SUMS
      - name: Attach the provenance bundle to the release files
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        # The same Sigstore bundle `gh attestation verify` fetches, as a release file, so it can be checked offline
        # (gh attestation verify FILE --bundle relikey-provenance.intoto.jsonl --repo relikeyhq/relikey).
        run: cp "$BUNDLE" agent/dist/relikey-provenance.intoto.jsonl
      # installs cosign v3.0.6
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign the sums and each binary (keyless cosign, a Sigstore bundle per file)
        working-directory: agent/dist
        run: |
          for f in SHA256SUMS $(awk '{print $2}' SHA256SUMS | grep -v '\.cdx\.json$'); do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" > /dev/null
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: agent/dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: notes
          path: notes/
  sbom-attest:
    # One SBOM attestation per binary (actions/attest takes one SBOM a call); the list is build.py's binaries(), which
    # tests/test_release_build.py keeps in step.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        binary:
          - relikey-agent-linux-amd64
          - relikey-agent-linux-arm64
          - relikey-agent-linux-armv7
          - relikey-fleet-linux-amd64
          - relikey-fleet-linux-arm64
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        id: attest
        with:
          subject-path: dist/${{ matrix.binary }}
          sbom-path: dist/${{ matrix.binary }}.cdx.json
      - name: Keep the SBOM attestation bundle for the release files
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          BINARY: ${{ matrix.binary }}
        run: mkdir bundle && cp "$BUNDLE" "bundle/${BINARY}.cdx.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-attestation-${{ matrix.binary }}
          path: bundle/
  images:
    # The agent and fleet images on ghcr.io from the binaries the build job made (tools/release_images.py), each with
    # a provenance attestation in the registry and a keyless cosign signature, both by digest (#29).
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      agent: ${{ steps.push.outputs.agent }}
      fleet: ${{ steps.push.outputs.fleet }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: agent/dist/
      - name: Push the images
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx create --use --driver docker-container
          python3 tools/release_images.py push --version "${GITHUB_REF_NAME#v}" \
            --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER}" --digests digests.json
          echo "agent=$(jq -r '."relikey-agent"' digests.json)" >> "$GITHUB_OUTPUT"
          echo "fleet=$(jq -r '."relikey-fleet"' digests.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/relikey-agent
          subject-digest: ${{ steps.push.outputs.agent }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/relikey-fleet
          subject-digest: ${{ steps.push.outputs.fleet }}
          push-to-registry: true
      # installs cosign v3.0.6
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
      - name: Sign the images (keyless, by digest)
        env:
          AGENT: ${{ steps.push.outputs.agent }}
          FLEET: ${{ steps.push.outputs.fleet }}
        run: |
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER}/relikey-agent@${AGENT}"
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER}/relikey-fleet@${FLEET}"
