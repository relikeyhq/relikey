# SPDX-License-Identifier: EUPL-1.2
# A tag v* becomes a release: the edge agent and the fleet service built reproducibly by agent/build.py (two checkouts,
# identical hashes), their SHA-256 sums, a build provenance attestation GitHub signs, and a GitHub release with the
# notes from CHANGELOG.md. Verify: sha256sum -c SHA256SUMS, then gh attestation verify FILE --repo relikeyhq/relikey
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0              # build.py release builds twice from a clean checkout of the tag
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.3"        # build.py refuses any other toolchain
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the binaries and their sums
        run: python agent/build.py release
      - name: Take the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir notes
          awk -v v="## [${version}]" 'index($0, v) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes/notes.md
          if ! grep -q '[^[:space:]]' notes/notes.md; then
            echo "CHANGELOG.md has no section for ${version}: add it before tagging" >&2
            exit 1
          fi
          {
            echo
            echo "Verify: \`sha256sum -c SHA256SUMS\`, then \`gh attestation verify FILE --repo ${GITHUB_REPOSITORY}\`."
          } >> notes/notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        id: attest
        with:
          subject-checksums: agent/dist/SHA256SUMS
      - name: Attach the provenance bundle to the release files
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        # The same Sigstore bundle `gh attestation verify` fetches, as a release file, so it can be checked offline
        # (gh attestation verify FILE --bundle relikey-provenance.intoto.jsonl --repo relikeyhq/relikey).
        run: cp "$BUNDLE" agent/dist/relikey-provenance.intoto.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: agent/dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: notes
          path: notes/
  github-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: notes
          path: notes/
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${GITHUB_REF_NAME}" \
            --notes-file notes/notes.md \
            dist/*
