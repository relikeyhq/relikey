# SPDX-License-Identifier: EUPL-1.2
# A tag v* becomes a release, only if CI passed on the tagged commit on main (tools/release_gate.py). The build runs
# in the reusable release-build.yml (SLSA Build L3: binaries, SBOMs, sums, attestations, keyless signatures and the
# images); this workflow then publishes a GitHub release with the notes from CHANGELOG.md and the image digests.
# Verify: sha256sum -c SHA256SUMS, then gh attestation verify FILE --repo relikeyhq/relikey
# (README.md, "Verifying a release").
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  ci-passed:
    # Nothing is built for a commit whose CI run on main did not pass (0.1.0 and 0.1.1 were tagged on broken commits).
    runs-on: ubuntu-24.04
    timeout-minutes: 60               # waits up to 45 minutes for a CI run still in progress
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: CI passed on the tagged commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_gate.py --repo "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}" --wait-minutes 45
  build:
    # The build runs in a reusable workflow (release-build.yml): SLSA Build L3 (#28)
    needs: ci-passed
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
  github-release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: sbom-attestation-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: notes
          path: notes/
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT: ${{ needs.build.outputs.agent }}
          FLEET: ${{ needs.build.outputs.fleet }}
        run: |
          # the image digests, and how to check their signature and provenance (README.md, "Verifying a release")
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER}"
          signer="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-build.yml@${GITHUB_REF}"
          {
            echo
            echo "Images, by digest: \`${registry}/relikey-agent@${AGENT}\` and \`${registry}/relikey-fleet@${FLEET}\`."
            echo "Verify: \`cosign verify IMAGE@DIGEST --certificate-identity ${signer}" \
              "--certificate-oidc-issuer https://token.actions.githubusercontent.com\`," \
              "then \`gh attestation verify oci://IMAGE@DIGEST --repo ${GITHUB_REPOSITORY}\`."
          } >> notes/notes.md
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${GITHUB_REF_NAME}" \
            --notes-file notes/notes.md \
            dist/*
