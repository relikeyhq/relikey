# SPDX-License-Identifier: EUPL-1.2
# A tag v* becomes a release, only if CI passed on the tagged commit on main (tools/release_gate.py): the edge agent
# and the fleet service built reproducibly by agent/build.py (two checkouts, identical hashes), a CycloneDX SBOM for
# each binary, their SHA-256 sums, a smoke test of the built binaries, a build provenance attestation and an SBOM
# attestation per binary that GitHub signs, and a GitHub release with the notes from CHANGELOG.md.
# Verify: sha256sum -c SHA256SUMS, then gh attestation verify FILE --repo relikeyhq/relikey
# (README.md, "Verifying a release").
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  ci-passed:
    # Nothing is built for a commit whose CI run on main did not pass (0.1.0 and 0.1.1 were tagged on broken commits).
    runs-on: ubuntu-24.04
    timeout-minutes: 60               # waits up to 45 minutes for a CI run still in progress
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: CI passed on the tagged commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release_gate.py --repo "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}" --wait-minutes 45
  build:
    needs: ci-passed
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0              # build.py release builds twice from a clean checkout of the tag
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.3"        # build.py refuses any other toolchain
          cache-dependency-path: agent/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the binaries, their SBOMs and their sums
        run: python agent/build.py release
      - name: Smoke-test the binaries (run those for this runner, check the ELF target of the others)
        run: python agent/build.py smoke
      - name: Take the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir notes
          awk -v v="## [${version}]" 'index($0, v) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes/notes.md
          if ! grep -q '[^[:space:]]' notes/notes.md; then
            echo "CHANGELOG.md has no section for ${version}: add it before tagging" >&2
            exit 1
          fi
          {
            echo
            echo "Verify: \`sha256sum -c SHA256SUMS\`, then \`gh attestation verify FILE --repo ${GITHUB_REPOSITORY}\`;"
            echo "Each binary's CycloneDX SBOM is FILE.cdx.json, attested with it:" \
              "\`gh attestation verify FILE --repo ${GITHUB_REPOSITORY} --predicate-type https://cyclonedx.org/bom\`."
          } >> notes/notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        id: attest
        with:
          subject-checksums: agent/dist/SHA256SUMS
      - name: Attach the provenance bundle to the release files
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        # The same Sigstore bundle `gh attestation verify` fetches, as a release file, so it can be checked offline
        # (gh attestation verify FILE --bundle relikey-provenance.intoto.jsonl --repo relikeyhq/relikey).
        run: cp "$BUNDLE" agent/dist/relikey-provenance.intoto.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: agent/dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: notes
          path: notes/
  sbom-attest:
    # One SBOM attestation per binary (actions/attest takes one SBOM a call); the list is build.py's binaries(), which
    # tests/test_release_build.py keeps in step.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        binary:
          - relikey-agent-linux-amd64
          - relikey-agent-linux-arm64
          - relikey-agent-linux-armv7
          - relikey-fleet-linux-amd64
          - relikey-fleet-linux-arm64
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        id: attest
        with:
          subject-path: dist/${{ matrix.binary }}
          sbom-path: dist/${{ matrix.binary }}.cdx.json
      - name: Keep the SBOM attestation bundle for the release files
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          BINARY: ${{ matrix.binary }}
        run: mkdir bundle && cp "$BUNDLE" "bundle/${BINARY}.cdx.intoto.jsonl"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-attestation-${{ matrix.binary }}
          path: bundle/
  github-release:
    needs: [build, sbom-attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: sbom-attestation-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: notes
          path: notes/
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${GITHUB_REF_NAME}" \
            --notes-file notes/notes.md \
            dist/*
