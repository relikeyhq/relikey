# SPDX-License-Identifier: EUPL-1.2
# Weekly updates, as pull requests that CI checks: the pinned workflow actions, the Go modules of the agent, its tools
# and the fleet, the hash-locked Python tools (requirements-ci.txt, requirements-test.txt) and the digest-pinned base
# images of the two image files (named Dockerfile.* because Dependabot's docker ecosystem only reads that name).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directories: [/agent, /agent/tools, /fleet]
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-tools:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: [/deploy/core, /deploy/edge]
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
