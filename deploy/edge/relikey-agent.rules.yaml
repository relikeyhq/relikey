# SPDX-License-Identifier: EUPL-1.2
# Prometheus alerting rules for an edge site's agent (docs/agent.md, Metrics). Load the file in the site's Prometheus
# (rule_files) once the agent's metrics_dir is collected. Every rule reads only the stable metric names, so a release
# never breaks it without saying so in the changelog. Check with:
#   promtool check rules deploy/edge/relikey-agent.rules.yaml
#   promtool test rules deploy/edge/relikey-agent.rules.test.yaml
# An edge that goes silent and a failed attestation are alerted at the core, by KeyClerk; these are the site's view.
groups:
  - name: relikey-agent
    rules:
      - alert: RelikeyAgentSilent
        # The status is rewritten at least every 60 s (the heartbeat); a scrape can add up to its own interval.
        expr: time() - relikey_agent_status_updated_seconds > 180
        labels:
          severity: critical
        annotations:
          summary: "ReliKey agent on {{ $labels.instance }} stopped writing its status"
          description: >-
            The status is {{ $value | humanizeDuration }} old; the agent rewrites it at least every 60 s. The agent
            has stopped, hangs, or cannot write metrics_dir (status.json says why in metrics_dir_error). Leases keep
            their last applied state until it runs again: check the container, then `relikey-agent status`.

      - alert: RelikeyAgentUnhealthy
        # An edge the desk ended is unhealthy by design; RelikeyAgentEnded reports it instead.
        expr: relikey_agent_healthy == 0 unless relikey_agent_ended == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ReliKey agent on {{ $labels.instance }} fails its health gate"
          description: >-
            The canary gate fails: a plan left over tick after tick (Warpgate refuses the changes, or in shadow mode
            the new version disagrees with the enforcing one), a status too old, or no pull that ever succeeded.
            `relikey-agent status` names the reason and what fixes it.

      - alert: RelikeyAgentBundleRefused
        expr: increase(relikey_agent_bundles_refused_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "ReliKey agent on {{ $labels.instance }} refused a bundle or notice"
          description: >-
            The verifier refused what the desk sent: a signature that does not verify, a bundle for another edge,
            an old serial replayed, a signed time that does not fit the edge's clock, or a policy or ceiling outside
            the pins. The agent keeps the last bundle it accepted. Its log names the check that failed; take it to
            the desk's officer, since a refused bundle can mean the desk or the path is not what it should be.

      - alert: RelikeyAgentActionFailed
        expr: increase(relikey_agent_action_failures_total[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "ReliKey agent on {{ $labels.instance }} could not apply a change to Warpgate"
          description: >-
            A grant or a revoke failed at Warpgate, so Warpgate may not match the leases: an access that should
            have ended may still be open. The agent retries each tick; the log names the action and Warpgate's
            answer. Check Warpgate's admin API and the agent's token.

      - alert: RelikeyAgentCannotReadWarpgate
        expr: increase(relikey_agent_observe_errors_total[15m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ReliKey agent on {{ $labels.instance }} cannot read Warpgate's state"
          description: >-
            Reading Warpgate failed again and again for 10 minutes. Warpgate exports no metrics of its own, so this
            is the only sign of trouble there. Check that Warpgate runs and that the agent's token still works.

      - alert: RelikeyAgentPullsFailing
        expr: increase(relikey_agent_pulls_failed_total[15m]) >= 3
        labels:
          severity: warning
        annotations:
          summary: "ReliKey agent on {{ $labels.instance }} cannot pull from the desk"
          description: >-
            {{ $value | printf "%.0f" }} pulls failed in 15 minutes: the desk is unreachable or refuses this edge.
            Leases still end on time; new leases and early revocations wait. The core sees the same edge go silent. Check
            the network path to the desk, then the agent's log for the desk's answer.

      - alert: RelikeyAgentEnded
        expr: relikey_agent_ended == 1
        labels:
          severity: warning
        annotations:
          summary: "The desk ended the ReliKey agent on {{ $labels.instance }}"
          description: >-
            The desk sent this edge its ended notice: it applies nothing more. Expected when an officer retired the
            edge; otherwise ask the desk's officer why, since a new enrolment is needed to bring it back.
