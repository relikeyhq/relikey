# The cryptography on every ReliKey link, in every format and behind every trust anchor (decision 0022 part A).
#
# Generated into docs/reference/crypto.md and the CycloneDX CBOM by tools/docs.py; checked by tools/check_model.py.
# Every claim says how it was checked ("checked") and for which pinned version ("version"): a component whose version in
# components.yaml moves makes its claims stale until they are checked again. "probe" names the negotiated-group check the
# full-stack run makes (lab/e2e/crypto_probe.py); a claim not yet probed says so.
#
# kex values: hybrid (X25519MLKEM768 or mlkem768x25519-sha256 offered and preferred), classical, conditional (depends
# on the other end), none (no transport security: loopback only), n/a.
# policy (decision 0022 point A3): required (both ends ReliKey's: non-hybrid fails closed), visible (hybrid preferred,
# a classical fallback is allowed and reported), record (the other end is not ReliKey's: what was negotiated is recorded).

components:
  front:
    version: 2.11.7-alpine
    tls_server: hybrid
    checked: "Caddy is Go (1.24+ offers X25519MLKEM768 by default); no curve is pinned: the edge-facing site also serves image pulls (F-18) by container runtimes built with older Go, so enforcement is the agent's (client side). Probe 2026-10-24 (full-stack run 2): the broker, desk and edge-facing names and the admin listener negotiate X25519MLKEM768 with a hybrid-only and a default client"
  agent:
    version: null
    tls_client: hybrid
    checked: "agent/internal/httpx: RequireHybrid allows only X25519MLKEM768 on the clerk (F-06) and bastion (F-07) links and refuses a classical peer (hybrid_test.go); the negotiated group is in status.json. Full-stack run 2: status.json reported X25519MLKEM768 on both links, against the deployed front and Warpgate 0.30.0, with hybrid required"
  bastion:
    version: 0.30.1
    tls_server: hybrid
    tls_client: hybrid
    ssh_client: hybrid
    ssh_server: hybrid
    checked: >
      Warpgate v0.30.0 source: rustls 0.23.46 with the aws-lc-rs provider (Cargo.toml features, Cargo.lock), which offers
      X25519MLKEM768 by default; SSH client kex list starts with MLKEM768X25519_SHA256 (warpgate-protocol-ssh client
      mod.rs:743) but continues down to DH_G1_SHA1. Probe 2026-10-24 (full-stack run 2): HTTPS negotiates X25519MLKEM768
      (hybrid-only and default client); the SSH server negotiates mlkem768x25519-sha256 with OpenSSH 10.0 by default,
      falls back to curve25519-sha256, offers no sntrup761x25519-sha512 and refuses diffie-hellman-group14-sha1.
      v0.30.1 (2026-10-26, source): rustls 0.23.46 with aws-lc-rs as before, the SSH client kex list unchanged
      (mod.rs:743-752); russh 0.63.3 to 0.65.0. Probe 2026-10-26 (full-stack run 6, OpenSSH 10.0p2): the SSH server
      negotiates mlkem768x25519-sha256 by default, curve25519-sha256 when asked, refuses sntrup761x25519-sha512 and
      diffie-hellman-group14-sha1, as on 0.30.0
  broker:
    version: 26.8.1
    tls_server: none
    tls_client: unverified
    checked: >
      Keycloak listens on the pod's loopback in plain http behind the front (F-22, compose.yaml); as a TLS client to the
      organisation's IdP (F-12) it uses its JDK, whose hybrid group support is not verified
  facade:
    version: v0.6.3-alpine-rootless
    tls_server: unverified
    checked: lldap's LDAPS stack not read; old LDAP clients negotiate whatever they speak
  mirror:
    version: v2.1.22
    tls_server: none
    checked: zot serves the front on loopback in plain http (F-24)
  broker-db:
    version: 16.8-alpine
    tls_server: none
    checked: PostgreSQL on the pod's loopback (F-25), no TLS

# One entry per flow in flows.yaml (the model check refuses a flow without one).
links:
  F-01: {kex: conditional, policy: visible, ends: [person browser, front], note: hybrid with current Chrome, Edge and Firefox; older browsers classical}
  F-02: {kex: conditional, policy: visible, ends: [person browser, front]}
  F-03: {kex: conditional, policy: visible, ends: [person SSH or DB client, bastion], note: "Warpgate's SSH server prefers mlkem768x25519-sha256 (probe, full-stack run 2), classical curve25519 for older clients; Windows' bundled OpenSSH 9.5 offers only sntrup761, which russh lacks: classical"}
  F-03b: {kex: conditional, policy: visible, ends: [person browser, proxy]}
  F-03c: {kex: hybrid, policy: visible, ends: [proxy, bastion], note: loopback on the edge host}
  F-04: {kex: hybrid, policy: visible, ends: [bastion rustls, front], note: both offer hybrid; not pinned, the broker's site also serves people's browsers}
  F-05: {kex: none, policy: required, ends: [clerk, broker], note: loopback http inside the core pod}
  F-06: {kex: hybrid, policy: required, ends: [agent, front], note: the agent refuses a non-hybrid handshake and reports the group}
  F-07: {kex: hybrid, policy: required, ends: [agent, bastion rustls], note: loopback on the edge host}
  F-08: {kex: unverified, policy: visible, ends: [agent, facade], note: loopback; lldap's TLS not verified, so not pinned}
  F-09: {kex: conditional, policy: record, ends: [bastion rustls, organisation store]}
  F-10: {kex: conditional, policy: record, ends: [bastion, legacy system], note: "per target: the SSH client list reaches DH_G1_SHA1 and TLS 'preferred' mode falls back to plaintext; a per-target floor is part A3"}
  F-11: {kex: conditional, policy: record, ends: [legacy system, facade], note: whatever the legacy LDAP client speaks; plain LDAP only where the system cannot do LDAPS}
  F-12: {kex: unverified, policy: record, ends: [broker JDK, organisation IdP]}
  F-13: {kex: conditional, policy: record, ends: [clerk, organisation store]}
  F-14: {kex: conditional, policy: record, ends: [clerk, OpenBao]}
  F-15: {kex: n/a, policy: record, ends: [person, legacy panel], note: no network}
  F-16: {kex: conditional, policy: visible, ends: [person SSH client, bastion], note: local access port}
  F-17: {kex: conditional, policy: visible, ends: [person SSH client, agent], note: local access port; the agent's SSH listener is part of the carried-lease work}
  F-18: {kex: conditional, policy: visible, ends: [edge host container runtime, front], note: "the runtime's TLS stack decides: runtimes built with Go 1.24 or later offer hybrid, older ones (podman 4.8) do not"}
  F-19: {kex: conditional, policy: record, ends: [edge host, organisation time and DNS], note: NTS where possible}
  F-20: {kex: conditional, policy: record, ends: [clerk, organisation escrow]}
  F-21: {kex: conditional, policy: visible, ends: [agent, organisation store], note: not built; the agent will prefer hybrid and report the group}
  F-22: {kex: none, policy: required, ends: [front, broker], note: loopback}
  F-23: {kex: none, policy: required, ends: [front, clerk], note: loopback}
  F-24: {kex: none, policy: required, ends: [front, mirror], note: loopback}
  F-25: {kex: none, policy: required, ends: [broker, broker-db], note: loopback}
  F-26: {kex: none, policy: required, ends: [broker, clerk], note: loopback}
  F-27: {kex: hybrid, policy: required, ends: [agent, front], note: as F-06 - the agent refuses a non-hybrid handshake}
  F-28: {kex: none, policy: required, ends: [front, fleet], note: loopback inside the core pod}

# Signed and encrypted formats (KeyClerk's edge interface; KeyClerk owns them, decision 0022 part B).
formats:
  kc-edge-bundle-v3: {signature: Ed25519, quantum: classical, owner: keyclerk, plan: hybrid signature format (KeyClerk Q3, by 2030) and the rotation anchor (Q5)}
  kc-edge-ceiling-v2: {signature: Ed25519, quantum: classical, owner: keyclerk, plan: floor carried at or above itself (Q5)}
  kc-edge-statement: {signature: Ed25519, quantum: classical, owner: keyclerk, plan: hybrid signature format (Q3)}
  kc-relay-v1: {encryption: X25519, quantum: classical, owner: keyclerk, plan: HPKE with a hybrid KEM after escrow (Q2)}
  kc-unlock-v2: {key_agreement: P-256 static-static ECDH, quantum: classical, owner: keyclerk, plan: symmetric secret agreed at enrolment by hybrid KEM (Q6)}
  break-glass escrow: {encryption: not built (C-09), quantum: n/a, owner: keyclerk, plan: HPKE with a hybrid KEM, monthly rotation (Q2)}
  approval proofs: {signature: ES256 or RS256 (Keycloak tokens), quantum: classical, owner: keyclerk, plan: follows Keycloak}

# Keys whose compromise lasts: what a forger would need.
anchors:
  bundle key: {algorithm: Ed25519, custody: KeyClerk signer, pinned_on: every edge, quantum: classical, rotation: KeyClerk Q5}
  officer key: {algorithm: Ed25519, custody: the officer's hardware token, pinned_on: every edge, quantum: classical, rotation: KeyClerk Q5}
  rotation anchor: {algorithm: SLH-DSA, custody: offline, pinned_on: "edges enrolled with KeyClerk's 0.29.0 enrolment format (stored only; the co-signed chain comes after the engine is public)", quantum: post-quantum, rotation: not built (Q5, Q7)}
  enrolment key: {algorithm: Ed25519, custody: the edge (TPM on an assured edge), pinned_on: KeyClerk, quantum: classical, rotation: rotate_edge}
  unlock key: {algorithm: P-256, custody: the edge's TPM where present, pinned_on: KeyClerk, quantum: classical, rotation: KeyClerk Q6}
  Keycloak realm keys: {algorithm: RS256 or ES256, custody: Keycloak, pinned_on: Warpgate and the desk via JWKS, quantum: classical, rotation: Keycloak key rotation}
  KeyClerk TLS pin: {algorithm: the desk certificate's key (pin_sha256), custody: the core, pinned_on: every edge, quantum: classical, rotation: re-pin with the certificate}

residuals:
  - Keycloak's JDK as a TLS client (F-12) and its token signing keys stay classical until Keycloak offers otherwise.
  - Windows' bundled OpenSSH 9.5 offers only sntrup761, which russh lacks; those sessions are classical.
  - TLS inspection by the organisation re-originates connections classically; the pinned agent links refuse it.
  - The hop to a legacy system is whatever it speaks; the edge's placement next to it is the compensation.
  - Passkeys are classical in Keycloak and hardware authenticators; post-quantum passkeys exist only in software (RFC 9964).
  - The evidence chain anchoring of decision 0022 point A4 waits for the edge's hash-chained evidence log, not built yet.
